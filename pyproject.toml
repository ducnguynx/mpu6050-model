[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpu6050-sim"
version = "1.0.0"
description = "Configurable Python behavioral simulator for the InvenSense MPU-6050 6-axis IMU based on Farrell et al. (IEEE CSM, 2022)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0",
    "scipy>=1.10",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]
